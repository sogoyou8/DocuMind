name: DocuMind D1 CI
on:
  push:
    branches: [main, work/d1-render-foundation]
  pull_request:
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: documind
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: github_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind -d documind"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: github-ci-secret-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://documind:github_ci_only@127.0.0.1:5432/documind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static syntax / structure check
        run: python ../scripts/check-d1-syntax.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django settings and migration files
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run D1 test suite on real PostgreSQL
        run: python manage.py test documents -v 2
      - name: Inspect OpenAPI generation
        run: python manage.py spectacular --file /tmp/documind-openapi.yaml --validate
