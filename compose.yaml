services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind_local_only
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - documind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://documind:documind_local_only@postgres:5432/documind
      DJANGO_SECRET_KEY: local-dev-only-unsafe-change-before-public-use
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_DEBUG: "1"
      DOCUMIND_DEMO_READONLY: "0"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./scripts:/workspace/scripts:ro
      - ./frontend:/workspace/frontend:ro
      - ./compose.yaml:/workspace/compose.yaml:ro
      - ./render.yaml:/workspace/render.yaml:ro
    # Static assets were collected at image build under /opt, outside ./backend bind mount.
    # Do not run collectstatic alongside live tests: it races with WhiteNoise scan.
    command: sh -c "python manage.py migrate --noinput && gunicorn documind_api.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    depends_on:
      postgres:
        condition: service_healthy
  airflow:
    profiles: ["pipeline"]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    environment:
      DATABASE_URL: postgresql://documind:documind_local_only@postgres:5432/documind
      DJANGO_SECRET_KEY: local-dev-only-unsafe-change-before-any-public-use
      DJANGO_DEBUG: "0"
      DOCUMIND_DEMO_READONLY: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      AIRFLOW_HOME: /opt/airflow/state
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      PYTHONPATH: /opt/documind/backend
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./backend:/opt/documind/backend:ro
      - ./airflow/dags:/opt/airflow/dags:ro
      - documind_airflow_state:/opt/airflow/state
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  metabase:
    profiles: ["analytics"]
    # Open-source Metabase, pinned to a known v0.64 release.
    # Local H2 metadata is persisted in a named volume. NOT for production.
    image: metabase/metabase:v0.64.1
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TIMEZONE: Europe/Paris
      JAVA_TOOL_OPTIONS: -Xmx1536m
    ports:
      - "127.0.0.1:3033:3000"
    volumes:
      - documind_metabase_state:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.12.11
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
    # Host access is intentionally loopback only. Never expose models publicly.
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - documind_ollama_models:/root/.ollama

  rag:
    profiles: ["ai"]
    build:
      context: ./backend
      dockerfile: Dockerfile.rag
    environment:
      DATABASE_URL: postgresql://documind:documind_local_only@postgres:5432/documind
      DJANGO_SECRET_KEY: local-dev-only-unsafe-change-before-public-use
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,rag
      DJANGO_DEBUG: "1"
      DOCUMIND_DEMO_READONLY: "0"
      DOCUMIND_AI_ENABLED: "1"
      DOCUMIND_OLLAMA_URL: http://ollama:11434
      DOCUMIND_EMBED_MODEL: nomic-embed-text
      DOCUMIND_CHAT_MODEL: qwen2.5:1.5b
      DOCUMIND_CHROMA_PATH: /opt/documind-chroma
      ANONYMIZED_TELEMETRY: "false"
      OTEL_SDK_DISABLED: "true"
      LANGCHAIN_TRACING_V2: "false"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./backend:/app
      - documind_chroma_state:/opt/documind-chroma
    command: sh -c "python manage.py migrate --noinput && gunicorn documind_api.wsgi:application --bind 0.0.0.0:8001 --workers 1 --threads 2 --timeout 180"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      ollama:
        condition: service_started

  web:
    profiles: ["ui"]
    image: node:22-alpine
    working_dir: /app
    environment:
      DOCUMIND_PROXY_TARGET: http://rag:8001
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - documind_web_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    # The local full UI expects the separately started optional AI profile.
    # This service neither runs on Render nor exposes the backend publicly.

  ui-e2e:
    profiles: ["qa"]
    image: mcr.microsoft.com/playwright:v1.56.0-noble
    working_dir: /app
    environment:
      DOCUMIND_E2E_BASE_URL: http://web:5173
      DOCUMIND_E2E_PASSWORD: ${DOCUMIND_E2E_PASSWORD:-}
      CI: "1"
    volumes:
      - ./frontend:/app
      - documind_web_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run test:e2e"
    depends_on:
      web:
        condition: service_started
    # Browser runs inside isolated Docker; screenshots are stored under
    # frontend/test-results/ and never uploaded to an external service.

volumes:
  documind_pg:
  documind_airflow_state:
  documind_metabase_state:
  documind_ollama_models:
  documind_chroma_state:
  documind_web_node_modules:
